name: Link check

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check links
        run: python3 scripts/check_links.py

      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/link-check.md reports/link-check.json
          if git diff --cached --quiet; then
            echo "Report unchanged."
          else
            git commit -m "Link check report"
            git push
          fi

      - name: Open or update the dead-link issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dead=$(python3 -c "import json; print(len(json.load(open('reports/link-check.json'))['dead']))")
          if [ "$dead" -eq 0 ]; then
            echo "No dead links."
            exit 0
          fi
          {
            echo "週次リンクチェックでリンク切れが見つかりました。"
            echo ""
            sed -n '/## リンク切れ/,/^$/p' reports/link-check.md
            echo "詳細: reports/link-check.md"
          } > /tmp/issue-body.md
          existing=$(gh issue list --search "リンク切れ in:title" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body-file /tmp/issue-body.md
          else
            gh issue create --title "リンク切れが見つかりました（週次チェック）" --body-file /tmp/issue-body.md
          fi
